[package]
name = "argus-mac-video"
description = "Native NSView host for the embedded libmpv video surface on macOS"
version.workspace = true
edition.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSGraphics", "NSWindow"] }
