[package]
name = "argus-desktop"
description = "Argus desktop app (macOS first, then Windows/Linux)"
version.workspace = true
edition.workspace = true

[lib]
name = "argus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argus-core = { path = "../../../crates/argus-core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
argus-mac-video = { path = "../../../crates/argus-mac-video" }
