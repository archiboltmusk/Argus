<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect MyAnimeList to Argus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --ink: #f3f4f6;
      --ink-muted: #94a3b8;
      --ink-subtle: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #101726 0%, var(--bg) 80%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 229, 255, 0.05);
      text-align: center;
    }

    .logo-container {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.02));
      border: 1px solid rgba(0, 229, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .logo-eye {
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 0.925rem;
      color: var(--ink-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.875rem 1.25rem;
      background: var(--accent);
      color: #040914;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 229, 255, 0.4);
    }

    .divider {
      margin: 1.75rem 0 1.25rem;
      display: flex;
      align-items: center;
      color: var(--ink-subtle);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .divider::before { margin-right: 1rem; }
    .divider::after { margin-left: 1rem; }

    .code-box-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }

    textarea.code-box {
      width: 100%;
      height: 84px;
      background: rgba(7, 10, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 0.75rem;
      resize: none;
      outline: none;
      line-height: 1.4;
      word-break: break-all;
    }

    textarea.code-box:focus {
      border-color: rgba(0, 229, 255, 0.4);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .footnote {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--ink-subtle);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <svg class="logo-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>

    <h1>Connect MyAnimeList to Argus</h1>
    <p class="subtitle">
      Returning to Argus to complete authorization.<br>
      Your browser may prompt to open the app.
    </p>

    <a id="open-argus-btn" class="btn-primary" href="#">
      Open Argus
    </a>

    <div class="divider">or copy code manually</div>

    <div class="code-box-wrapper">
      <textarea id="code-box" class="code-box" readonly placeholder="Waiting for code..."></textarea>
    </div>

    <button id="copy-btn" class="btn-secondary" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </svg>
      <span id="copy-text">Copy code</span>
    </button>

    <p class="footnote">Argus Desktop · Safe & Private Local Media Hub</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    const state = params.get('state') || '';

    const codeBox = document.getElementById('code-box');
    const openBtn = document.getElementById('open-argus-btn');
    const copyBtn = document.getElementById('copy-btn');
    const copyText = document.getElementById('copy-text');

    if (code) {
      codeBox.value = code;

      // Construct Argus deep link callback
      const callbackUrl = `argus://mal?code=${encodeURIComponent(code)}` + (state ? `&state=${encodeURIComponent(state)}` : '');
      openBtn.href = callbackUrl;

      // Automatically trigger launch
      setTimeout(() => {
        window.location.href = callbackUrl;
      }, 350);
    } else {
      codeBox.value = "No authorization code found in URL.";
      openBtn.style.opacity = "0.5";
      openBtn.style.pointerEvents = "none";
    }

    copyBtn.addEventListener('click', async () => {
      if (!code) return;
      try {
        await navigator.clipboard.writeText(code);
        copyText.textContent = "Copied to clipboard!";
        copyBtn.style.borderColor = "var(--accent)";
        setTimeout(() => {
          copyText.textContent = "Copy code";
          copyBtn.style.borderColor = "rgba(255, 255, 255, 0.08)";
        }, 2000);
      } catch (e) {
        codeBox.select();
        document.execCommand('copy');
        copyText.textContent = "Copied!";
        setTimeout(() => { copyText.textContent = "Copy code"; }, 2000);
      }
    });
  </script>
</body>
</html>
