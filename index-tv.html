<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Legacy Android WebView Polyfills (Chrome 74-95 compatibility for smart projectors like Portronics Beem 470, Wanbo, HY300)
      (function () {
        if (typeof globalThis === "undefined") { window.globalThis = window; }
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function (str, newStr) {
            if (Object.prototype.toString.call(str).toLowerCase() === "[object regexp]") {
              return this.replace(str, newStr);
            }
            return this.replace(new RegExp(String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g"), newStr);
          };
        }
        if (!Array.prototype.at) {
          Array.prototype.at = function (n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }
        if (!String.prototype.at) {
          String.prototype.at = function (n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this.charAt(n);
          };
        }
        if (!Object.hasOwn) {
          Object.hasOwn = function (obj, prop) {
            return obj != null && Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }
        if (typeof Promise !== "undefined" && !Promise.allSettled) {
          Promise.allSettled = function (promises) {
            return Promise.all(
              Array.from(promises).map(function (p) {
                return Promise.resolve(p).then(
                  function (value) { return { status: "fulfilled", value: value }; },
                  function (reason) { return { status: "rejected", reason: reason }; }
                );
              })
            );
          };
        }
        if (typeof structuredClone !== "function") {
          window.structuredClone = function (val) {
            if (val === undefined || val === null || typeof val !== "object") return val;
            return JSON.parse(JSON.stringify(val));
          };
        }
        if (typeof crypto !== "undefined" && !crypto.randomUUID) {
          crypto.randomUUID = function () {
            if (crypto.getRandomValues) {
              var b = crypto.getRandomValues(new Uint8Array(16));
              b[6] = (b[6] & 0x0f) | 0x40;
              b[8] = (b[8] & 0x3f) | 0x80;
              var h = [];
              for (var i = 0; i < b.length; i++) {
                h.push((b[i] < 16 ? "0" : "") + b[i].toString(16));
              }
              return h.slice(0,4).join("") + "-" + h.slice(4,6).join("") + "-" + h.slice(6,8).join("") + "-" + h.slice(8,10).join("") + "-" + h.slice(10).join("");
            }
            return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
              var r = (Math.random() * 16) | 0;
              return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
            });
          };
        }
        if (typeof Element !== "undefined" && !Element.prototype.replaceChildren) {
          Element.prototype.replaceChildren = function () {
            while (this.firstChild) this.removeChild(this.firstChild);
            for (var i = 0; i < arguments.length; i++) {
              this.appendChild(typeof arguments[i] === "string" ? document.createTextNode(arguments[i]) : arguments[i]);
            }
          };
        }
        // Track startup health so older projectors never stall permanently on a blank black screen
        window.__argusBootErrors = [];
        window.addEventListener("error", function (e) {
          window.__argusBootErrors.push(String(e && (e.message || e.error || "Unknown script error")));
        });
      })();
    </script>
    <script>
      // A television lays out on this canvas, settled by eye on a real panel
      // from a sofa. Fixed on purpose, never derived: apparent size across a
      // room is a fraction of the screen, not a pixel count. Deriving it from
      // the panel handed a 4K stick a 1920 desktop canvas and every row read
      // half size; a 4K set renders this canvas sharper, not smaller. Fire TV's
      // own 960 is the other end of the same mistake, small enough that the px
      // floors inside clamp() win and the layout reads as zoomed in.
      // 1080 was the first settled value; 1140 came from the row below the
      // focused one being clipped by the hint bar, which needs vertical room
      // rather than a layout change, because the rail parks the focused row at
      // the top and the next row peeks under the chrome.
      // Matched to bp-safe-area's detection. Both must agree on what a TV is.
      //
      // Never patch this at runtime to try a different size. Changing the
      // viewport on a live page leaves Big Picture's focus in a state where
      // every second move stalls for about three seconds, measured on a Stick
      // 4K Max. It is safe here only because it runs before the bundle boots.
      (function () {
        try {
          /* Bigger number means a wider CSS viewport, so everything on screen
             gets SMALLER, cards included. Briefly taken to 1280 to fix "too
             zoomed in" and reverted: the complaint was that content did not FIT,
             and shrinking the whole canvas also shrinks the posters, which is the
             opposite of what a ten-foot screen wants. The fit problem was the
             hero logo at 20vh by 64vw pushing the rows off the bottom; that is
             capped in bp-spotlight.tsx instead. Settled by eye, never derived. */
          var CANVAS = 1140;
          var ua = navigator.userAgent || "";
          var tv =
            /\bAFT[A-Z0-9]+\b/.test(ua) ||
            /Android ?TV|Google ?TV|SMART-?TV|Tizen|Web ?0S|WebOS|NetCast|BRAVIA|HbbTV|CrKey|VIDAA|Titan|Panasonic|Viera|HomeOS|Roku|Projector|Portronics|Beem|Wanbo|Egate/i.test(
              ua,
            );
          /* A phone is not a television, and the TV canvas is far too wide for it. A phone
             gets the same Big Picture layout on a 960px canvas, which fits a phone held
             sideways at a readable size. Settings, Argus phone layout, turns this off.
             Keep the 960 in step with PHONE_CANVAS in src/lib/phone-layout.ts. */
          if (
            !tv &&
            /Android/i.test(ua) &&
            Math.min(screen.width, screen.height) < 600
          ) {
            var off = false;
            try {
              off =
                JSON.parse(localStorage.getItem("argus.settings") || "{}").androidPhoneLayout ===
                false;
            } catch (e) {}
            if (off) return;
            document.documentElement.setAttribute("data-phone", "");
            var phoneMeta = document.querySelector('meta[name="viewport"]');
            if (phoneMeta) phoneMeta.setAttribute("content", "width=960, viewport-fit=cover");
            return;
          }
          if (!tv) return;
          if (Math.abs(CANVAS - window.innerWidth) < 48) return;
          var m = document.querySelector('meta[name="viewport"]');
          if (m) m.setAttribute("content", "width=" + CANVAS + ", viewport-fit=cover");
        } catch (e) {
          /* leave the authored viewport alone */
        }
      })();
    </script>
    <meta name="theme-color" content="#111214" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Argus</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://api.strem.io" crossorigin />
    <link rel="dns-prefetch" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <!-- media=print keeps these two off the render-blocking path. A remote
         stylesheet blocks the first paint of the whole document, and on a stick
         over wifi that was 1.5s of held frames before the boot splash below
         could show. Nothing paints text until React mounts seconds later, so
         the swap always lands long before a glyph is needed. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=sentient@400,500,600,700,401,501,601,701&f[]=switzer@400,500,600,700&f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Vazirmatn:wght@100..900&family=Inter:wght@100..900&family=IBM+Plex+Sans:wght@100..700&family=Plus+Jakarta+Sans:wght@100..800&family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html, body, #root {
        background: var(--color-canvas, #111214);
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }

      /* The boot splash is inline on purpose. Measured on a Fire TV Stick 4K
         Max: the html lands at 195ms and the first React paint at 9952ms, so
         anything owned by the bundle cannot cover the boot at all. #08090A is
         the same value android res/colors.xml paints as windowBackground, so
         the native starting window hands over to this with no seam. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(28px, 4.5vh, 64px);
        background: #08090a;
        pointer-events: none;
        transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot[data-leaving="true"] { opacity: 0; }
      #boot svg { display: block; }
      .boot-mark {
        width: min(24vw, 200px);
        color: #f3f3f3;
        animation: boot-mark-in 1200ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-spin {
        position: relative;
        display: block;
        width: clamp(34px, 4.4vh, 58px);
        height: clamp(34px, 4.4vh, 58px);
        animation: boot-spinner-in 900ms cubic-bezier(0.22, 1, 0.36, 1) 500ms both;
      }
      .boot-spin svg { width: 100%; height: 100%; }
      .boot-spin .arc {
        transform-origin: center;
        stroke-dasharray: 1, 126;
        animation:
          boot-spin 1300ms cubic-bezier(0.5, 0, 0.5, 1) infinite,
          boot-dash 2000ms ease-in-out infinite;
      }
      @keyframes boot-mark-in {
        0% { opacity: 0; transform: translate3d(0, 22px, 0) scale(0.94); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes boot-spinner-in {
        from { opacity: 0; transform: translate3d(0, 10px, 0); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-dash {
        0% { stroke-dasharray: 1, 126; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90, 126; stroke-dashoffset: -22; }
        100% { stroke-dasharray: 1, 126; stroke-dashoffset: -125; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, .boot-mark, .boot-spin, .boot-spin .arc { animation: none; transition: none; }
        .boot-spin .arc { stroke-dasharray: 90, 126; }
      }
      /* Held upright, a phone shows the 960px canvas at about 40%, which cannot be read.
         The prompt is drawn in canvas pixels, so it needs to be large. */
      #rotate-hint {
        display: none;
      }
      @media (orientation: portrait) {
        html[data-phone] #rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 2147483600;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 80px;
          text-align: center;
          background: #08090a;
          color: #f4f5f7;
          font: 600 64px/1.3 system-ui, sans-serif;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg class="boot-mark" viewBox="0 0 64 64" fill="currentColor"><path d="M32 12C18 12 7 24 3 32c4 8 15 20 29 20s25-12 29-20C57 24 46 12 32 12Zm0 8a12 12 0 1 1 0 24 12 12 0 0 1 0-24Z" /><path d="M32 26a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z" /></svg>
      <span class="boot-spin">
        <svg viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="25" r="20" stroke="#f3f3f3" stroke-opacity="0.12" stroke-width="3" />
          <circle
            class="arc"
            cx="25"
            cy="25"
            r="20"
            stroke="#e8a95c"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </span>
    </div>
    <div id="root"></div>
    <div id="rotate-hint" aria-hidden="true">Turn your phone sideways to use Argus</div>
    <script>
      try {
        var art = JSON.parse(localStorage.getItem('argus.custom-artwork.v1') || '{}').launch;
        if (art && /^[\w-]{1,80}$/.test(art.id) && typeof art.poster === 'string' && art.poster.length < 200000 && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(art.poster)) {
          var mark = document.querySelector('#boot > .boot-mark');
          var custom = document.createElement('div');
          custom.id = 'argus-custom-boot-art';
          custom.style.cssText = 'position:relative;width:min(24vw,200px);height:min(22vh,200px)';
          custom.setAttribute('aria-hidden', 'true');
          var poster = document.createElement('img');
          poster.src = art.poster; poster.alt = ''; poster.style.cssText = 'width:100%;height:100%;object-fit:contain';
          custom.appendChild(poster); mark.after(custom); mark.style.display = 'none';
        }
      } catch (e) {}
    </script>
    <script>
      // Fallback boot splash watchdog: if module scripts stall, fail syntax parsing on older
      // Android WebViews, or offline network times out, ensure #boot is dismissed after 4000ms.
      (function () {
        window.setTimeout(function () {
          var b = document.getElementById('boot');
          if (b && !b.dataset.leaving) {
            b.dataset.leaving = 'true';
            window.setTimeout(function () {
              if (b.parentNode) b.parentNode.removeChild(b);
            }, 650);
          }
        }, 4000);

        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            var errs = (window.__argusBootErrors || []).slice(-3);
            var msg = errs.length > 0 ? errs.join(' | ') : 'WebView engine did not finish loading bundle (System WebView may be outdated).';
            root.innerHTML =
              '<div style="position:fixed;inset:0;background:#08090a;color:#f3f4f6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;text-align:center;font-family:system-ui,sans-serif;z-index:99999">' +
                '<h1 style="font-size:28px;font-weight:700;margin:0 0 12px">Argus Recovery Mode</h1>' +
                '<p style="font-size:16px;color:#9ca3af;max-width:640px;margin:0 0 24px;line-height:1.5">' + msg.replace(/</g, '&lt;') + '</p>' +
                '<button onclick="location.reload()" autofocus style="background:#e8a95c;color:#111214;border:0;border-radius:8px;padding:12px 28px;font-size:16px;font-weight:600;cursor:pointer">Reload Argus</button>' +
              '</div>';
          }
        }, 8500);
      })();
    </script>
    <script type="module" src="/src/boot-artwork.ts"></script>
    <script type="module" src="/src/main-tv.tsx"></script>
  </body>
</html>
