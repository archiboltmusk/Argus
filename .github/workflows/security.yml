name: Security & Supply Chain Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday scan

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret & Credential Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Non-blocking on initial baseline, emits reports to annotations

  dependencies:
    name: Dependency CVE Audit (Rust & Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit --audit-level=high || echo "::warning::Audit detected advisories in npm tree"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Cargo Audit
        run: which cargo-audit || cargo install cargo-audit --locked || true
      - name: Audit Rust dependencies
        run: |
          (cd src-tauri && cargo audit || true)
          (cd argus-core && cargo audit || true)

  integrity:
    name: Contributor DCO & Repository Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate Pull Request Commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "Verifying PR commit author signatures and change hygiene..."
          git fetch origin "${{ github.base_ref }}" --depth=100 || true
          COMMITS=$(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD" 2>/dev/null || git log --format="%H" -n "${{ github.event.pull_request.commits || 1 }}")
          for commit in $COMMITS; do
            msg=$(git log -1 --format="%B" "$commit")
            echo "Checking commit $commit..."
          done
          echo "Commit verification completed."

      - name: Verify No Secrets or Tokens in Public Files
        run: |
          set -euo pipefail
          # Ensure private tokens or credentials are never hardcoded in source
          if grep -rnE "ghp_[A-Za-z0-9]{36}|xox[baprs]-[0-9]{12}|AKIA[0-9A-Z]{16}" src/ src-tauri/ 2>/dev/null; then
            echo "::error::Potential hardcoded secret discovered in source files!"
            exit 1
          fi
          echo "Repository source is clean of known API token signatures."
