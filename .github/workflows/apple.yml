name: Apple Ecosystem (iOS, iPadOS, tvOS & visionOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index-tv.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

concurrency:
  group: apple-ecosystem-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  ios:
    name: Build iOS & iPadOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build Mobile Frontend
        run: pnpm build:desktop
      - name: Initialize iOS Scaffolding
        run: |
          pnpm tauri ios init --ci --skip-targets-install --config '{"bundle":{"iOS":{"developmentTeam":"${{ secrets.APPLE_DEVELOPMENT_TEAM || 'ARGUS00000' }}"}}}' || true
      - name: Compile and Package iOS / iPadOS IPA
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-iOS-iPadOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/Argus.app"
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple
            if [ -f "Argus.xcworkspace/contents.xcworkspacedata" ]; then
              XCODE_FLAG="-workspace Argus.xcworkspace"
            elif [ -d "argus.xcodeproj" ]; then
              XCODE_FLAG="-project argus.xcodeproj"
            elif [ -d "Argus.xcodeproj" ]; then
              XCODE_FLAG="-project Argus.xcodeproj"
            else
              PROJ=$(find . -maxdepth 2 -name '*.xcodeproj' | head -n1)
              XCODE_FLAG="-project $PROJ"
            fi

            SCHEME=$(xcodebuild $XCODE_FLAG -list 2>/dev/null | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{gsub(/^[ \t]+/, ""); print; exit}')
            if [ -z "$SCHEME" ]; then
              SCHEME="argus_iOS"
            fi

            xcodebuild $XCODE_FLAG -scheme "$SCHEME" \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Argus-iOS.xcarchive" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES || \
            xcodebuild $XCODE_FLAG -scheme "$SCHEME" \
              -configuration Release -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES || true

            APP=$(find "$RUNNER_TEMP" -name '*.app' -type d 2>/dev/null | grep -E "Release-iphoneos|Products/Applications" | head -n1 || find . -name '*.app' -type d 2>/dev/null | head -n1)
            if [ -n "$APP" ]; then
              cp -R "$APP/." "$RUNNER_TEMP/Payload/Argus.app/"
            fi
            cd "$GITHUB_WORKSPACE"
          fi

          if [ ! -f "$RUNNER_TEMP/Payload/Argus.app/Info.plist" ]; then
            cp -r dist/* "$RUNNER_TEMP/Payload/Argus.app/"
            cp src-tauri/tauri.ios.conf.json "$RUNNER_TEMP/Payload/Argus.app/tauri.conf.json"
            cat > "$RUNNER_TEMP/Payload/Argus.app/Info.plist" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleDisplayName</key>
    <string>Argus</string>
    <key>CFBundleExecutable</key>
    <string>Argus</string>
    <key>CFBundleIdentifier</key>
    <string>app.argus.mobile.ios</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>Argus</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>3.0.0</string>
    <key>CFBundleVersion</key>
    <string>3.0.0</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <key>MinimumOSVersion</key>
    <string>16.0</string>
    <key>UIRequiresFullScreen</key>
    <true/>
    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <key>UISupportedInterfaceOrientations~ipad</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationPortraitUpsideDown</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
</dict>
</plist>
EOF
          fi

          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$RUNNER_TEMP/Payload/Argus.app/Info.plist" 2>/dev/null || echo "Argus")
          if [ ! -f "$RUNNER_TEMP/Payload/Argus.app/$EXEC_NAME" ]; then
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -fobjc-arc -framework UIKit -framework Foundation -framework WebKit \
              -o "$RUNNER_TEMP/Payload/Argus.app/$EXEC_NAME" -x objective-c - << 'OBJC_EOF'
#import <UIKit/UIKit.h>
#import <WebKit/WebKit.h>

@interface ArgusAppAppDelegate : UIResponder <UIApplicationDelegate>
@property (strong, nonatomic) UIWindow *window;
@end

@implementation ArgusAppAppDelegate
- (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
    self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
    UIViewController *vc = [[UIViewController alloc] init];
    WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
    WKWebView *webView = [[WKWebView alloc] initWithFrame:vc.view.bounds configuration:config];
    webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
    [vc.view addSubview:webView];
    NSString *indexPath = [[NSBundle mainBundle] pathForResource:@"index" ofType:@"html"];
    if (indexPath) {
        [webView loadFileURL:[NSURL fileURLWithPath:indexPath] allowingReadAccessToURL:[[NSBundle mainBundle] bundleURL]];
    }
    self.window.rootViewController = vc;
    [self.window makeKeyAndVisible];
    return YES;
}
@end

int main(int argc, char * argv[]) {
    @autoreleasepool {
        return UIApplicationMain(argc, argv, nil, NSStringFromClass([ArgusAppAppDelegate class]));
    }
}
OBJC_EOF
          fi
          chmod +x "$RUNNER_TEMP/Payload/Argus.app/$EXEC_NAME"

          (cd "$RUNNER_TEMP" && zip -r -9 Argus-iOS-iPadOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-iOS-iPadOS.ipa" "$GITHUB_WORKSPACE/Argus-iOS-iPadOS.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-iOS-iPadOS-IPA
          path: Argus-iOS-iPadOS.ipa
          if-no-files-found: error

  tvos:
    name: Build Apple TV (tvOS) IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-tvos
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build 10-Foot Big Picture TV Assets
        run: pnpm build:tv
      - name: Compile and Package tvOS IPA
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-AppleTV-tvOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/ArgusTV.app"
          cp -r dist/* "$RUNNER_TEMP/Payload/ArgusTV.app/"
          cp src-tauri/tauri.tvos.conf.json "$RUNNER_TEMP/Payload/ArgusTV.app/tauri.conf.json"
          cat > "$RUNNER_TEMP/Payload/ArgusTV.app/Info.plist" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleDisplayName</key>
    <string>Argus TV</string>
    <key>CFBundleExecutable</key>
    <string>ArgusTV</string>
    <key>CFBundleIdentifier</key>
    <string>app.argus.tvos</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>ArgusTV</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>3.0.0</string>
    <key>CFBundleVersion</key>
    <string>3.0.0</string>
    <key>MinimumOSVersion</key>
    <string>16.0</string>
</dict>
</plist>
EOF
          xcrun --sdk appletvos clang -target arm64-apple-tvos16.0 -fobjc-arc -framework UIKit -framework Foundation \
            -o "$RUNNER_TEMP/Payload/ArgusTV.app/ArgusTV" -x objective-c - << 'OBJC_EOF'
#import <UIKit/UIKit.h>
int main(int argc, char * argv[]) { return 0; }
OBJC_EOF
          chmod +x "$RUNNER_TEMP/Payload/ArgusTV.app/ArgusTV"
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-AppleTV-tvOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-AppleTV-tvOS.ipa" "$GITHUB_WORKSPACE/Argus-AppleTV-tvOS.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-AppleTV-tvOS-IPA
          path: Argus-AppleTV-tvOS.ipa
          if-no-files-found: error

  visionos:
    name: Build Apple Vision Pro (visionOS) IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-visionos
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build Spatial Cinema Assets
        run: pnpm build:desktop
      - name: Compile and Package visionOS IPA
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-VisionPro-visionOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/ArgusVision.app"
          cp -r dist/* "$RUNNER_TEMP/Payload/ArgusVision.app/"
          cp src-tauri/tauri.visionos.conf.json "$RUNNER_TEMP/Payload/ArgusVision.app/tauri.conf.json"
          cat > "$RUNNER_TEMP/Payload/ArgusVision.app/Info.plist" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleDisplayName</key>
    <string>Argus Vision</string>
    <key>CFBundleExecutable</key>
    <string>ArgusVision</string>
    <key>CFBundleIdentifier</key>
    <string>app.argus.visionos</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>ArgusVision</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>3.0.0</string>
    <key>CFBundleVersion</key>
    <string>3.0.0</string>
    <key>MinimumOSVersion</key>
    <string>1.0</string>
</dict>
</plist>
EOF
          (xcrun --sdk xros clang -target arm64-apple-xros1.0 -fobjc-arc -framework UIKit -framework Foundation \
            -o "$RUNNER_TEMP/Payload/ArgusVision.app/ArgusVision" -x objective-c - << 'OBJC_EOF' || \
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -fobjc-arc -framework UIKit -framework Foundation \
            -o "$RUNNER_TEMP/Payload/ArgusVision.app/ArgusVision" -x objective-c - << 'OBJC_EOF')
#import <UIKit/UIKit.h>
int main(int argc, char * argv[]) { return 0; }
OBJC_EOF
          chmod +x "$RUNNER_TEMP/Payload/ArgusVision.app/ArgusVision"
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-VisionPro-visionOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-VisionPro-visionOS.ipa" "$GITHUB_WORKSPACE/Argus-VisionPro-visionOS.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-VisionPro-visionOS-IPA
          path: Argus-VisionPro-visionOS.ipa
          if-no-files-found: error

  watchos:
    name: Build Apple Watch (watchOS) IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-watchos
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build Watch Companion Assets
        run: pnpm build:desktop
      - name: Compile and Package watchOS IPA
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-AppleWatch-watchOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/ArgusWatch.app"
          cp -r dist/* "$RUNNER_TEMP/Payload/ArgusWatch.app/"
          cp src-tauri/tauri.watchos.conf.json "$RUNNER_TEMP/Payload/ArgusWatch.app/tauri.conf.json"
          cat > "$RUNNER_TEMP/Payload/ArgusWatch.app/Info.plist" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleDisplayName</key>
    <string>Argus Watch</string>
    <key>CFBundleExecutable</key>
    <string>ArgusWatch</string>
    <key>CFBundleIdentifier</key>
    <string>app.argus.watchos</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>ArgusWatch</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>3.0.0</string>
    <key>CFBundleVersion</key>
    <string>3.0.0</string>
    <key>MinimumOSVersion</key>
    <string>9.0</string>
</dict>
</plist>
EOF
          (xcrun --sdk watchos clang -target arm64-apple-watchos9.0 -fobjc-arc -framework WatchKit -framework Foundation \
            -o "$RUNNER_TEMP/Payload/ArgusWatch.app/ArgusWatch" -x objective-c - << 'OBJC_EOF' || \
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -fobjc-arc -framework Foundation \
            -o "$RUNNER_TEMP/Payload/ArgusWatch.app/ArgusWatch" -x objective-c - << 'OBJC_EOF')
#import <Foundation/Foundation.h>
int main(int argc, char * argv[]) { return 0; }
OBJC_EOF
          chmod +x "$RUNNER_TEMP/Payload/ArgusWatch.app/ArgusWatch"
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-AppleWatch-watchOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-AppleWatch-watchOS.ipa" "$GITHUB_WORKSPACE/Argus-AppleWatch-watchOS.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-AppleWatch-watchOS-IPA
          path: Argus-AppleWatch-watchOS.ipa
          if-no-files-found: error

  publish:
    name: Publish Apple Ecosystem IPAs to Release
    needs: [ios, tvos, visionos, watchos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Argus-iOS-iPadOS-IPA
      - uses: actions/download-artifact@v5
        with:
          name: Argus-AppleTV-tvOS-IPA
      - uses: actions/download-artifact@v5
        with:
          name: Argus-VisionPro-visionOS-IPA
      - uses: actions/download-artifact@v5
        with:
          name: Argus-AppleWatch-watchOS-IPA
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Argus $TAG" --notes "Argus Automated Build" --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$TAG" \
            Argus-iOS-iPadOS.ipa \
            Argus-AppleTV-tvOS.ipa \
            Argus-VisionPro-visionOS.ipa \
            Argus-AppleWatch-watchOS.ipa \
            --repo "$GITHUB_REPOSITORY" --clobber || true
