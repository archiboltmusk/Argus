name: Apple Ecosystem (iOS, iPadOS, tvOS & visionOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index-tv.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/apple.yml"
      - "scripts/package-apple-app.mjs"
      - "scripts/apple-platforms.mjs"
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode (build-only, dry-run, publish)"
        type: choice
        options:
          - build-only
          - dry-run
          - publish
        default: publish
      target:
        description: "Target Apple platform"
        type: choice
        options:
          - all
          - ios
          - tvos
          - visionos
          - watchos
        default: all

concurrency:
  group: apple-ecosystem-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_ARGUS_API_BASE: ${{ vars.VITE_ARGUS_API_BASE }}
  VITE_ARGUS_TRAKT_BASE: ${{ vars.VITE_ARGUS_TRAKT_BASE }}
  VITE_ARGUS_TRAKT_CLIENT_ID: ${{ vars.VITE_ARGUS_TRAKT_CLIENT_ID }}
  VITE_ARGUS_MAL_BASE: ${{ vars.VITE_ARGUS_MAL_BASE }}
  VITE_ARGUS_MAL_CLIENT_ID: ${{ vars.VITE_ARGUS_MAL_CLIENT_ID }}
  VITE_ARGUS_TVDB_BASE: ${{ vars.VITE_ARGUS_TVDB_BASE }}
  VITE_ARGUS_PUBLIC_RELAY: ${{ vars.VITE_ARGUS_PUBLIC_RELAY }}
  VITE_ARGUS_RELAY_BASE: ${{ vars.VITE_ARGUS_RELAY_BASE }}
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  ios:
    name: Build iOS & iPadOS IPA
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build Mobile Frontend
        run: pnpm build:desktop
      - name: Initialize iOS Scaffolding
        run: |
          pnpm tauri ios init --ci --skip-targets-install --config '{"bundle":{"iOS":{"developmentTeam":"${{ secrets.APPLE_DEVELOPMENT_TEAM || 'ARGUS00000' }}"}}}' || true
      - name: Compile and Package iOS / iPadOS IPA
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::iOS build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              vm_stat 2>/dev/null || true
              ps -Ao pid,etime,%cpu,rss,command -r 2>/dev/null | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-iOS-iPadOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/Argus.app"
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple
            set +e
            if [ -f "Argus.xcworkspace/contents.xcworkspacedata" ]; then
              XCODE_FLAG="-workspace Argus.xcworkspace"
            elif [ -d "argus.xcodeproj" ]; then
              XCODE_FLAG="-project argus.xcodeproj"
            elif [ -d "Argus.xcodeproj" ]; then
              XCODE_FLAG="-project Argus.xcodeproj"
            else
              PROJ=$(find . -maxdepth 2 -name '*.xcodeproj' | head -n1)
              XCODE_FLAG="-project $PROJ"
            fi

            SCHEME=$(xcodebuild $XCODE_FLAG -list 2>/dev/null | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{gsub(/^[ \t]+/, ""); print; exit}')
            if [ -z "$SCHEME" ]; then
              SCHEME="argus_iOS"
            fi

            xcodebuild $XCODE_FLAG -scheme "$SCHEME" \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Argus-iOS.xcarchive" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES ||
              echo "::warning::The iOS archive failed. Packaging the experimental WebView build."

            APP=$(find "$RUNNER_TEMP/Argus-iOS.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit 2>/dev/null || true)
            if [ -n "$APP" ] && [ -d "$APP" ]; then
              cp -R "$APP/." "$RUNNER_TEMP/Payload/Argus.app/"
            fi
            set -e
            cd "$GITHUB_WORKSPACE"
          fi

          node scripts/package-apple-app.mjs --platform ios --app-dir "$RUNNER_TEMP/Payload/Argus.app" --dist-dir dist --version "$(node -p 'require("./src-tauri/tauri.ios.conf.json").version')"
          if [ -d "$RUNNER_TEMP/Payload/Argus.app/Frameworks" ]; then
            for fw in "$RUNNER_TEMP/Payload/Argus.app/Frameworks"/*.framework; do
              [ -d "$fw" ] && codesign -s - --force "$fw" 2>/dev/null || true
            done
          fi
          codesign -s - --force "$RUNNER_TEMP/Payload/Argus.app" 2>/dev/null || true
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-iOS-iPadOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-iOS-iPadOS.ipa" "$GITHUB_WORKSPACE/Argus-iOS-iPadOS.ipa"

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Smoke-check IPA payload (Argus-iOS-iPadOS.ipa)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$GITHUB_WORKSPACE/Argus-iOS-iPadOS.ipa" -d "$TMP"
          PLIST=$(find "$TMP/Payload" -maxdepth 2 -name Info.plist | head -n1)
          [ -n "$PLIST" ] || { echo "::error::Missing Info.plist in Argus-iOS-iPadOS.ipa"; exit 1; }
          plutil -lint "$PLIST"
          EXECUTABLE=$(plutil -extract CFBundleExecutable raw -o - "$PLIST")
          test -s "$(dirname "$PLIST")/$EXECUTABLE"
          VERSION=$(node -p 'require("./src-tauri/tauri.ios.conf.json").version')
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")" = "$VERSION"
          rm -rf "$TMP"
      - name: Generate Step Summary Checksum Card
        run: |
          echo "### 📱 iOS / iPadOS Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          fsize=$(du -h Argus-iOS-iPadOS.ipa | cut -f1)
          fhash=$(shasum -a 256 Argus-iOS-iPadOS.ipa | cut -d' ' -f1)
          echo "| \`Argus-iOS-iPadOS.ipa\` | iOS 16+ / iPadOS | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-iOS-iPadOS-IPA
          path: Argus-iOS-iPadOS.ipa
          if-no-files-found: error

  tvos:
    needs: [ios]
    name: Build Apple TV (tvOS) IPA
    if: ${{ !cancelled() && (inputs.target == null || inputs.target == 'all' || inputs.target == 'tvos') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[apple]')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-tvos
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build 10-Foot Big Picture TV Assets
        run: pnpm build:tv
      - name: Compile and Package tvOS IPA
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::tvOS build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              vm_stat 2>/dev/null || true
              ps -Ao pid,etime,%cpu,rss,command -r 2>/dev/null | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-AppleTV-tvOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/ArgusTV.app"
          node scripts/package-apple-app.mjs --platform tvos --app-dir "$RUNNER_TEMP/Payload/ArgusTV.app" --dist-dir dist --version "$(node -p 'require("./package.json").version')"
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-AppleTV-tvOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-AppleTV-tvOS.ipa" "$GITHUB_WORKSPACE/Argus-AppleTV-tvOS.ipa"

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Smoke-check IPA payload (Argus-AppleTV-tvOS.ipa)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$GITHUB_WORKSPACE/Argus-AppleTV-tvOS.ipa" -d "$TMP"
          PLIST=$(find "$TMP/Payload" -maxdepth 2 -name Info.plist | head -n1)
          [ -n "$PLIST" ] || { echo "::error::Missing Info.plist in Argus-AppleTV-tvOS.ipa"; exit 1; }
          python3 -c 'import plistlib,sys; plistlib.load(open(sys.argv[1], "rb"))' "$PLIST"
          rm -rf "$TMP"
      - name: Generate Step Summary Checksum Card
        run: |
          echo "### 📺 Apple TV (tvOS) Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          fsize=$(du -h Argus-AppleTV-tvOS.ipa | cut -f1)
          fhash=$(shasum -a 256 Argus-AppleTV-tvOS.ipa | cut -d' ' -f1)
          echo "| \`Argus-AppleTV-tvOS.ipa\` | tvOS 17+ | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-AppleTV-tvOS-IPA
          path: Argus-AppleTV-tvOS.ipa
          if-no-files-found: error

  visionos:
    needs: [tvos]
    name: Build Apple Vision Pro (visionOS) IPA
    if: ${{ !cancelled() && (inputs.target == null || inputs.target == 'all' || inputs.target == 'visionos') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[apple]')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build Spatial Cinema Assets
        run: pnpm build:desktop
      - name: Compile and Package visionOS IPA
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::visionOS build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              vm_stat 2>/dev/null || true
              ps -Ao pid,etime,%cpu,rss,command -r 2>/dev/null | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-VisionPro-visionOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/ArgusVision.app"
          node scripts/package-apple-app.mjs --platform visionos --app-dir "$RUNNER_TEMP/Payload/ArgusVision.app" --dist-dir dist --version "$(node -p 'require("./package.json").version')"
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-VisionPro-visionOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-VisionPro-visionOS.ipa" "$GITHUB_WORKSPACE/Argus-VisionPro-visionOS.ipa"

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Smoke-check IPA payload (Argus-VisionPro-visionOS.ipa)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$GITHUB_WORKSPACE/Argus-VisionPro-visionOS.ipa" -d "$TMP"
          PLIST=$(find "$TMP/Payload" -maxdepth 2 -name Info.plist | head -n1)
          [ -n "$PLIST" ] || { echo "::error::Missing Info.plist in Argus-VisionPro-visionOS.ipa"; exit 1; }
          python3 -c 'import plistlib,sys; plistlib.load(open(sys.argv[1], "rb"))' "$PLIST"
          rm -rf "$TMP"
      - name: Generate Step Summary Checksum Card
        run: |
          echo "### 🥽 Apple Vision Pro (visionOS) Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          fsize=$(du -h Argus-VisionPro-visionOS.ipa | cut -f1)
          fhash=$(shasum -a 256 Argus-VisionPro-visionOS.ipa | cut -d' ' -f1)
          echo "| \`Argus-VisionPro-visionOS.ipa\` | visionOS 1.0+ | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-VisionPro-visionOS-IPA
          path: Argus-VisionPro-visionOS.ipa
          if-no-files-found: error

  watchos:
    needs: [visionos]
    name: Build Apple Watch (watchOS) IPA
    if: ${{ !cancelled() && (inputs.target == null || inputs.target == 'all' || inputs.target == 'watchos') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[apple]')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-watchos
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Build Watch Companion Assets
        run: pnpm build:desktop
      - name: Compile and Package watchOS IPA
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::watchOS build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              vm_stat 2>/dev/null || true
              ps -Ao pid,etime,%cpu,rss,command -r 2>/dev/null | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Argus-AppleWatch-watchOS.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/ArgusWatch.app"
          node scripts/package-apple-app.mjs --platform watchos --app-dir "$RUNNER_TEMP/Payload/ArgusWatch.app" --dist-dir dist --version "$(node -p 'require("./package.json").version')"
          (cd "$RUNNER_TEMP" && zip -r -9 Argus-AppleWatch-watchOS.ipa Payload)
          cp "$RUNNER_TEMP/Argus-AppleWatch-watchOS.ipa" "$GITHUB_WORKSPACE/Argus-AppleWatch-watchOS.ipa"

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Smoke-check IPA payload (Argus-AppleWatch-watchOS.ipa)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$GITHUB_WORKSPACE/Argus-AppleWatch-watchOS.ipa" -d "$TMP"
          PLIST=$(find "$TMP/Payload" -maxdepth 2 -name Info.plist | head -n1)
          [ -n "$PLIST" ] || { echo "::error::Missing Info.plist in Argus-AppleWatch-watchOS.ipa"; exit 1; }
          python3 -c 'import plistlib,sys; plistlib.load(open(sys.argv[1], "rb"))' "$PLIST"
          rm -rf "$TMP"
      - name: Generate Step Summary Checksum Card
        run: |
          echo "### ⌚ Apple Watch (watchOS) Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          fsize=$(du -h Argus-AppleWatch-watchOS.ipa | cut -f1)
          fhash=$(shasum -a 256 Argus-AppleWatch-watchOS.ipa | cut -d' ' -f1)
          echo "| \`Argus-AppleWatch-watchOS.ipa\` | watchOS 10+ | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-AppleWatch-watchOS-IPA
          path: Argus-AppleWatch-watchOS.ipa
          if-no-files-found: error

  publish:
    name: Publish Apple Ecosystem IPAs to Release
    needs: [ios, tvos, visionos, watchos]
    if: always() && (inputs.mode == null || inputs.mode == 'publish') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Argus-iOS-iPadOS-IPA
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Argus-AppleTV-tvOS-IPA
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Argus-VisionPro-visionOS-IPA
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Argus-AppleWatch-watchOS-IPA
      - name: Publish Step Summary Table
        run: |
          echo "### 🍏 All Apple Ecosystem Packages & Checksums" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for ipa in *.ipa; do
            [ -f "$ipa" ] || continue
            fsize=$(du -h "$ipa" | cut -f1)
            fhash=$(sha256sum "$ipa" | cut -d' ' -f1)
            echo "| \`$ipa\` | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta"
          RELEASE_FLAGS=(--latest=false)
          if [ "$TAG" = "beta" ]; then RELEASE_FLAGS+=(--prerelease); fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Argus $TAG" --notes "Experimental Apple developer packages. Watch, TV and Vision ports are not certified for full native feature parity." --repo "$GITHUB_REPOSITORY" "${RELEASE_FLAGS[@]}" || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          fi
          for ipa in *.ipa; do
            if [ -f "$ipa" ]; then
              echo "Uploading $ipa to $TAG..."
              LABEL="Experimental iOS/iPadOS package"
              if [ "$ipa" != "Argus-iOS-iPadOS.ipa" ]; then
                LABEL="Developer bootstrap - native UI not implemented"
              elif unzip -Z1 "$ipa" | grep -Fx 'Payload/Argus.app/ArgusWebOnly' > /dev/null; then
                LABEL="Experimental iOS/iPadOS web-only package"
              fi
              gh release upload "$TAG" "$ipa#$LABEL" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done
          IOS_IPA="Argus-iOS-iPadOS.ipa"
          if [ -f "$IOS_IPA" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CONTENTS=$(unzip -Z1 "$IOS_IPA") || exit 1
            if ! grep -Fx 'Payload/Argus.app/ArgusWebOnly' <<< "$CONTENTS" > /dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$IOS_IPA#Argus iOS & iPadOS IPA" --repo "$GITHUB_REPOSITORY" --clobber || true
            fi
          fi
