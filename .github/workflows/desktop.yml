name: Desktop

# Windows and Linux builds, separate from the CI run so the macOS .dmg and
# updater feed publish without waiting for them. Starts once CI has published
# the Mac build, stamps that build's version, and adds its entries to latest.json.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "src-tauri/tauri.windows.conf.json"
      - "src-tauri/tauri.linux*.json"
      - "src-tauri/tauri.updater.conf.json"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Release tag to publish to (e.g. v3.17.1)"
        required: false
        default: ""

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  version:
    name: Resolve target release version
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then exit 0; fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [ -n "$CI_RUN" ]; then
            PUBLISHED=$(gh api "repos/$REPO/actions/runs/$CI_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Publish release" and .conclusion == "success")] | length')
            if [ "$PUBLISHED" = "0" ]; then
              echo "CI did not publish a Mac update; skipping desktop release."
              exit 0
            fi
          fi
          if [ -n "${{ inputs.target_tag }}" ]; then
            TAG="${{ inputs.target_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || echo "")
            if [ -z "$TAG" ] || [ "$TAG" = "null" ] || [ "$TAG" = "beta" ]; then
              echo "::error::No stable updater release is available"; exit 1
            fi
          fi
          VERSION="${TAG#v}"
          if [ -n "$CI_SHA" ]; then
            RELEASE_SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
            if [ "$RELEASE_SHA" != "$CI_SHA" ]; then
              echo "A newer release superseded this CI run; skipping stale desktop publication."
              exit 0
            fi
          fi
          gh release download "$TAG" --repo "$REPO" -p latest.json -O latest.json
          node scripts/validate-update-manifest.mjs latest.json "$VERSION" darwin-aarch64
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  windows:
    name: Windows x64 (NSIS, MSI)
    needs: [preflight, version]
    if: github.event_name == 'pull_request' || needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      # libmpv-2.dll, mpv.exe and the yt-dlp / ffmpeg / ffprobe sidecars.
      # tauri.windows.conf.json bundles them next to the app.
      - run: pnpm run setup:libmpv
      - run: pnpm run setup:mpv
      - run: pnpm run setup:binaries
      - run: pnpm run setup:models
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ARGUS_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/ci-set-beta-version.mjs
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail
          EXTRA=""
          # Signed updater artifacts (the NSIS setup .exe + .sig) only off PRs when signing key is configured.
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          pnpm tauri build --bundles nsis,msi $EXTRA --ignore-version-mismatches
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          mkdir -p out
          cp "$(ls $B/nsis/*-setup.exe | head -n1)" out/Argus-windows-x64-setup.exe
          cp "$(ls $B/msi/*.msi | head -n1)" out/Argus-windows-x64.msi
          if ls $B/nsis/*-setup.exe.sig >/dev/null 2>&1; then
            cp "$(ls $B/nsis/*-setup.exe.sig | head -n1)" out/Argus-windows-x64-setup.exe.sig
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-windows-x64
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux x64 (AppImage, deb)
    needs: [preflight, version]
    if: github.event_name == 'pull_request' || needs.version.outputs.publish == 'true'
    # 24.04 ships libmpv2 (mpv 0.37) and webkit2gtk-4.1. The AppImage therefore
    # needs glibc 2.39 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # linuxdeploy's bundled strip chokes on newer .relr.dyn sections.
      NO_STRIP: "true"
      # CI runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf xdg-utils file curl \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libmpv-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      # yt-dlp / ffmpeg / ffprobe sidecars declared as externalBin.
      - run: pnpm run setup:binaries
      - run: pnpm run setup:models
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ARGUS_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/ci-set-beta-version.mjs
      - name: Build AppImage and deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          pnpm tauri build --bundles appimage,deb $EXTRA --ignore-version-mismatches
      - name: Collect artifacts
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          mkdir -p out
          cp "$(ls $B/appimage/*.AppImage | head -n1)" out/Argus-linux-x64.AppImage
          cp "$(ls $B/deb/*.deb | head -n1)" out/Argus-linux-x64.deb
          if ls $B/appimage/*.AppImage.sig >/dev/null 2>&1; then
            cp "$(ls $B/appimage/*.AppImage.sig | head -n1)" out/Argus-linux-x64.AppImage.sig
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-linux-x64
          path: out/*
          if-no-files-found: error

  publish-desktop:
    name: Publish Windows and Linux release
    needs: [version, windows, linux]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        if: needs.windows.result == 'success'
        with:
          name: Argus-windows-x64
          path: win
      - uses: actions/download-artifact@v8
        if: needs.linux.result == 'success'
        with:
          name: Argus-linux-x64
          path: linux
      - name: Merge into latest.json and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$REPO/releases/download/$TAG"
          gh release download "$TAG" --repo "$REPO" -p latest.json -O latest.json
          node scripts/validate-update-manifest.mjs latest.json "${{ needs.version.outputs.version }}" darwin-aarch64
          FILES=()
          if [ -d win ]; then
            if [ -f win/Argus-windows-x64-setup.exe.sig ]; then
              jq --rawfile sig win/Argus-windows-x64-setup.exe.sig --arg url "$BASE/Argus-windows-x64-setup.exe" \
                '.platforms["windows-x86_64"] = {signature: ($sig|rtrimstr("\n")), url: $url}' latest.json > l.tmp && mv l.tmp latest.json
            fi
            FILES+=(win/Argus-windows-x64-setup.exe win/Argus-windows-x64.msi)
          fi
          if [ -d linux ]; then
            if [ -f linux/Argus-linux-x64.AppImage.sig ]; then
              jq --rawfile sig linux/Argus-linux-x64.AppImage.sig --arg url "$BASE/Argus-linux-x64.AppImage" \
                '.platforms["linux-x86_64"] = {signature: ($sig|rtrimstr("\n")), url: $url}' latest.json > l.tmp && mv l.tmp latest.json
            fi
            FILES+=(linux/Argus-linux-x64.AppImage linux/Argus-linux-x64.deb)
          fi
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No signed Windows/Linux bundle to publish"; exit 1; }
          node scripts/validate-update-manifest.mjs latest.json "${{ needs.version.outputs.version }}" darwin-aarch64
          cat latest.json
          gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
      - name: Refresh legacy Mac update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          if [ "$LATEST" = "$TAG" ]; then
            gh release view beta --repo "$REPO" >/dev/null 2>&1 || gh release create beta --repo "$REPO" --prerelease --latest=false --title "Argus beta" --notes "Legacy updater compatibility feed."
            gh release upload beta latest.json --repo "$REPO" --clobber
          fi
