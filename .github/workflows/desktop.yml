name: Desktop

# Called by CI after the verified Mac package has been staged as a draft.
# Promote one complete desktop release only after every platform succeeds.
on:
  workflow_call:
    inputs:
      target_tag:
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "scripts/fetch-binaries.mjs"
      - "src-tauri/tauri.windows.conf.json"
      - "src-tauri/tauri.linux*.json"
      - "src-tauri/tauri.updater.conf.json"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Release tag (for example v3.17.17, optional for build-only/dry-run)"
        required: false
        type: string
      mode:
        description: "Release mode"
        type: choice
        options:
          - publish
          - draft
          - build-only
          - dry-run
        default: publish
      target:
        description: "Platform target to build"
        type: choice
        options:
          - all
          - windows
          - windows-arm64
          - linux
        default: all

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VITE_ARGUS_API_BASE: ${{ vars.VITE_ARGUS_API_BASE }}
  VITE_ARGUS_TRAKT_BASE: ${{ vars.VITE_ARGUS_TRAKT_BASE }}
  VITE_ARGUS_TRAKT_CLIENT_ID: ${{ vars.VITE_ARGUS_TRAKT_CLIENT_ID }}
  VITE_ARGUS_MAL_BASE: ${{ vars.VITE_ARGUS_MAL_BASE }}
  VITE_ARGUS_MAL_CLIENT_ID: ${{ vars.VITE_ARGUS_MAL_CLIENT_ID }}
  VITE_ARGUS_TVDB_BASE: ${{ vars.VITE_ARGUS_TVDB_BASE }}
  VITE_ARGUS_PUBLIC_RELAY: ${{ vars.VITE_ARGUS_PUBLIC_RELAY }}
  VITE_ARGUS_RELAY_BASE: ${{ vars.VITE_ARGUS_RELAY_BASE }}
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  version:
    name: Resolve target release version
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      mode: ${{ steps.v.outputs.mode }}
      target: ${{ steps.v.outputs.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "target=all" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODE="${{ inputs.mode || 'publish' }}"
          TARGET="${{ inputs.target || 'all' }}"
          TAG="${{ inputs.target_tag }}"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          if [ -z "$TAG" ]; then
            PKG_VER=$(node -p 'require("./package.json").version')
            TAG="v$PKG_VER"
          fi

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]] || { echo "::error::An explicit version tag is required"; exit 1; }
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "dry-run" ] || [ "$MODE" = "build-only" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=false" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --repo "$REPO" -p latest.json -O latest.json 2>/dev/null; then
              break
            fi
            echo "Waiting for staged release asset to become available (attempt $attempt/5)..."
            sleep 3
          done
          if [ -f latest.json ]; then
            node scripts/validate-update-manifest.mjs latest.json "$VERSION" darwin-aarch64 || true
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  windows:
    name: Windows x64 (NSIS, MSI)
    needs: [version]
    if: (github.event_name == 'pull_request' || needs.version.outputs.publish == 'true' || needs.version.outputs.mode == 'build-only' || needs.version.outputs.mode == 'dry-run') && (inputs.target == null || inputs.target == 'all' || inputs.target == 'windows')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.7
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - run: pnpm run setup:libmpv
      - run: pnpm run setup:mpv
      - run: pnpm run setup:binaries
      - name: Smoke-test Windows FFmpeg sidecars
        shell: pwsh
        run: |
          & ./src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg sidecar failed to start" }
          & ./src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -version
          if ($LASTEXITCODE -ne 0) { throw "FFprobe sidecar failed to start" }
      - run: pnpm run setup:models
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ARGUS_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/ci-set-beta-version.mjs
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          EXTRA=""
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          pnpm tauri build --bundles nsis,msi $EXTRA --ignore-version-mismatches

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          mkdir -p out
          cp "$(ls $B/nsis/*-setup.exe | head -n1)" out/Argus-windows-x64-setup.exe
          cp "$(ls $B/msi/*.msi | head -n1)" out/Argus-windows-x64.msi
          if ls $B/nsis/*-setup.exe.sig >/dev/null 2>&1; then
            cp "$(ls $B/nsis/*-setup.exe.sig | head -n1)" out/Argus-windows-x64-setup.exe.sig
          fi
          ls -la out
      - name: Smoke-check Windows binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Missing release .exe" }
          if (-not (Test-Path "out/Argus-windows-x64-setup.exe")) { throw "Missing NSIS setup" }
          if (-not (Test-Path "out/Argus-windows-x64.msi")) { throw "Missing MSI" }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "Argus.exe crashed on startup with exit code $($proc.ExitCode)"
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
      - name: Generate Step Summary Checksum Card
        shell: bash
        run: |
          echo "### 🪟 Windows x64 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in out/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            fsize=$(du -h "$file" | cut -f1)
            fhash=$(sha256sum "$file" | cut -d' ' -f1)
            echo "| \`$fname\` | Windows x64 | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-windows-x64
          path: out/*
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 (Snapdragon X, Surface Pro)
    needs: [version]
    if: (github.event_name == 'pull_request' || needs.version.outputs.publish == 'true' || needs.version.outputs.mode == 'build-only' || needs.version.outputs.mode == 'dry-run') && (inputs.target == null || inputs.target == 'all' || inputs.target == 'windows-arm64')
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.7
        with:
          workspaces: src-tauri
          key: aarch64-pc-windows-msvc
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Fetch and configure ARM64 libmpv
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/libmpv | Out-Null
          $devUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261010/mpv-dev-aarch64-20261010-git-b2c255c13e.7z"
          try {
            Invoke-WebRequest -Uri $devUrl -OutFile "$env:TEMP\mpv-arm64.7z"
            7z x "$env:TEMP\mpv-arm64.7z" -o"$env:TEMP\mpv-arm64" -y
            Copy-Item "$env:TEMP\mpv-arm64\libmpv-2.dll" -Destination "src-tauri\libmpv\libmpv-2.dll" -Force
            if (Test-Path "$env:TEMP\mpv-arm64\include") {
              Copy-Item -Recurse "$env:TEMP\mpv-arm64\include" -Destination "src-tauri\libmpv\" -Force
            }
            if (Test-Path "$env:TEMP\mpv-arm64\libmpv.def") {
              lib /def:"$env:TEMP\mpv-arm64\libmpv.def" /machine:arm64 /out:"src-tauri\libmpv\mpv.lib"
            }
          } catch {
            Write-Warning "Could not fetch arm64 dev bundle directly, falling back to local libmpv setup"
            pnpm run setup:libmpv
          }
      - run: pnpm run setup:binaries
      - run: pnpm run setup:models
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ARGUS_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/ci-set-beta-version.mjs
      - name: Build ARM64 installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Ensure MSVC link.exe precedes Git Bash's /usr/bin/link.exe in PATH
          if [ -n "${VCToolsInstallDir:-}" ]; then
            MSVC_VC_POSIX=$(cygpath -u "$VCToolsInstallDir")
            for cand in "${MSVC_VC_POSIX}bin/Hostarm64/arm64" "${MSVC_VC_POSIX}bin/Hostx64/arm64"; do
              if [ -x "$cand/link.exe" ]; then
                export PATH="$cand:$PATH"
                export CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER="$(cygpath -w "$cand/link.exe")"
                echo "Using MSVC linker: $CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER"
                break
              fi
            done
          fi
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          EXTRA=""
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          pnpm tauri build --target aarch64-pc-windows-msvc --bundles nsis,msi $EXTRA --ignore-version-mismatches

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Collect ARM64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          B=src-tauri/target/aarch64-pc-windows-msvc/release/bundle
          mkdir -p out
          if ls $B/nsis/*-setup.exe >/dev/null 2>&1; then
            cp "$(ls $B/nsis/*-setup.exe | head -n1)" out/Argus-windows-arm64-setup.exe
          fi
          if ls $B/msi/*.msi >/dev/null 2>&1; then
            cp "$(ls $B/msi/*.msi | head -n1)" out/Argus-windows-arm64.msi
          fi
          if ls $B/nsis/*-setup.exe.sig >/dev/null 2>&1; then
            cp "$(ls $B/nsis/*-setup.exe.sig | head -n1)" out/Argus-windows-arm64-setup.exe.sig
          fi
          ls -la out
      - name: Generate Step Summary Checksum Card
        shell: bash
        run: |
          echo "### 🪟 Windows ARM64 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in out/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            fsize=$(du -h "$file" | cut -f1)
            fhash=$(sha256sum "$file" | cut -d' ' -f1)
            echo "| \`$fname\` | Windows ARM64 (Copilot+) | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-windows-arm64
          path: out/*
          if-no-files-found: warn

  linux:
    name: Linux x64 (AppImage, deb)
    needs: [version]
    if: (github.event_name == 'pull_request' || needs.version.outputs.publish == 'true' || needs.version.outputs.mode == 'build-only' || needs.version.outputs.mode == 'dry-run') && (inputs.target == null || inputs.target == 'all' || inputs.target == 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf xdg-utils file curl rpm \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libmpv-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.7
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - run: pnpm run setup:binaries
      - run: pnpm run setup:models
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ARGUS_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/ci-set-beta-version.mjs
      - name: Build AppImage, deb and rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              ps aux --sort=-%mem | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          EXTRA=""
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          pnpm tauri build --bundles appimage,deb,rpm $EXTRA --ignore-version-mismatches

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Collect artifacts
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          mkdir -p out
          cp "$(ls $B/appimage/*.AppImage | head -n1)" out/Argus-linux-x64.AppImage
          cp "$(ls $B/deb/*.deb | head -n1)" out/Argus-linux-x64.deb
          if ls $B/rpm/*.rpm >/dev/null 2>&1; then
            cp "$(ls $B/rpm/*.rpm | head -n1)" out/Argus-linux-x64.rpm
          fi
          if ls $B/appimage/*.AppImage.sig >/dev/null 2>&1; then
            cp "$(ls $B/appimage/*.AppImage.sig | head -n1)" out/Argus-linux-x64.AppImage.sig
          fi
          ls -la out
      - name: Smoke-check Linux AppImage & shared libs
        run: |
          set -euo pipefail
          chmod +x out/Argus-linux-x64.AppImage
          ./out/Argus-linux-x64.AppImage --appimage-extract >/dev/null
          BIN=$(find squashfs-root/usr/bin -maxdepth 1 -type f -executable | head -n1)
          if ldd "$BIN" | grep -q "not found"; then
            ldd "$BIN" | grep "not found"
            exit 1
          fi
          rm -rf squashfs-root
          timeout 6s xvfb-run -a ./out/Argus-linux-x64.AppImage || [ $? -eq 124 ]
      - name: Generate Step Summary Checksum Card
        run: |
          echo "### 🐧 Linux x64 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in out/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            fsize=$(du -h "$file" | cut -f1)
            fhash=$(sha256sum "$file" | cut -d' ' -f1)
            echo "| \`$fname\` | Linux x64 | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-linux-x64
          path: out/*
          if-no-files-found: error

  publish-desktop:
    name: Publish Windows and Linux release
    needs: [version, windows, windows-arm64, linux]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        if: needs.windows.result == 'success'
        with:
          name: Argus-windows-x64
          path: win
      - uses: actions/download-artifact@v8
        if: needs.windows-arm64.result == 'success'
        continue-on-error: true
        with:
          name: Argus-windows-arm64
          path: win-arm64
      - uses: actions/download-artifact@v8
        if: needs.linux.result == 'success'
        with:
          name: Argus-linux-x64
          path: linux
      - name: Merge into latest.json and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$REPO/releases/download/$TAG"
          gh release download "$TAG" --repo "$REPO" -p latest.json -O latest.json
          node scripts/validate-update-manifest.mjs latest.json "${{ needs.version.outputs.version }}" darwin-aarch64
          FILES=()
          if [ -d win ]; then
            if [ -f win/Argus-windows-x64-setup.exe.sig ]; then
              jq --rawfile sig win/Argus-windows-x64-setup.exe.sig --arg url "$BASE/Argus-windows-x64-setup.exe" \
                '.platforms["windows-x86_64"] = {signature: ($sig|rtrimstr("\n")), url: $url}' latest.json > l.tmp && mv l.tmp latest.json
            fi
            FILES+=(win/Argus-windows-x64-setup.exe win/Argus-windows-x64.msi)
          fi
          if [ -d win-arm64 ]; then
            if [ -f win-arm64/Argus-windows-arm64-setup.exe.sig ]; then
              jq --rawfile sig win-arm64/Argus-windows-arm64-setup.exe.sig --arg url "$BASE/Argus-windows-arm64-setup.exe" \
                '.platforms["windows-aarch64"] = {signature: ($sig|rtrimstr("\n")), url: $url}' latest.json > l.tmp && mv l.tmp latest.json
            fi
            if [ -f win-arm64/Argus-windows-arm64-setup.exe ]; then
              FILES+=(win-arm64/Argus-windows-arm64-setup.exe)
            fi
            if [ -f win-arm64/Argus-windows-arm64.msi ]; then
              FILES+=(win-arm64/Argus-windows-arm64.msi)
            fi
          fi
          if [ -d linux ]; then
            if [ -f linux/Argus-linux-x64.AppImage.sig ]; then
              jq --rawfile sig linux/Argus-linux-x64.AppImage.sig --arg url "$BASE/Argus-linux-x64.AppImage" \
                '.platforms["linux-x86_64"] = {signature: ($sig|rtrimstr("\n")), url: $url}' latest.json > l.tmp && mv l.tmp latest.json
            fi
            FILES+=(linux/Argus-linux-x64.AppImage linux/Argus-linux-x64.deb)
            if [ -f linux/Argus-linux-x64.rpm ]; then
              FILES+=(linux/Argus-linux-x64.rpm)
            fi
          fi
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No signed Windows/Linux bundle to publish"; exit 1; }
          node scripts/validate-update-manifest.mjs latest.json "${{ needs.version.outputs.version }}" darwin-aarch64 windows-x86_64 linux-x86_64
          cat latest.json
          gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
      - name: Refresh download links for completed platforms
        if: hashFiles('scripts/publish-release-page.mjs') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-page.mjs "${{ needs.version.outputs.tag }}" "${{ github.repository }}"
      - name: Publish installer checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir verified-assets
          gh release download "$TAG" --repo "$REPO" --dir verified-assets \
            -p Argus-aarch64.dmg -p Argus-aarch64.app.tar.gz \
            -p Argus-windows-x64-setup.exe -p Argus-windows-x64.msi \
            -p Argus-windows-arm64-setup.exe -p Argus-windows-arm64.msi \
            -p Argus-linux-x64.AppImage -p Argus-linux-x64.deb \
            -p "Argus-linux-x64.rpm" || true
          (
            cd verified-assets
            sha256sum Argus-* > SHA256SUMS.txt
          )
          gh release upload "$TAG" verified-assets/SHA256SUMS.txt --repo "$REPO" --clobber

      - name: Publish Step Summary Table
        run: |
          echo "### 🌐 Published Release Assets & Checksums" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          if [ -d verified-assets ]; then
            for f in verified-assets/Argus-*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              fsize=$(du -h "$f" | cut -f1)
              fhash=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| \`$fname\` | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest=true
      - name: Refresh legacy Mac update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          if [ "$LATEST" = "$TAG" ]; then
            gh release view beta --repo "$REPO" >/dev/null 2>&1 || gh release create beta --repo "$REPO" --prerelease --latest=false --title "Argus beta" --notes "Legacy updater compatibility feed."
            gh release upload beta latest.json --repo "$REPO" --clobber
          fi
