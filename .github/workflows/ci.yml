name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the .dmg as a pre-release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

# PR runs cancel when a newer commit lands. Main runs are never cancelled:
# GitHub keeps one running and one queued run per group, and a newer queued run
# replaces an older one, so the latest commit always publishes (latest wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Harbor tree is large; tsc and vite exceed the default ~2 GB heap.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # PRs only build the .dmg when native code or the build itself changed;
  # TS-only PRs get typecheck + core tests (about 2 minutes).
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      bundle: ${{ steps.diff.outputs.bundle }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "bundle=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          if echo "$FILES" | grep -qE '^(src-tauri/|argus-core/|\.github/workflows/|package\.json$|pnpm-lock\.yaml$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          # Packaging changes need the full .dmg build; plain Rust edits only a cargo check.
          if echo "$FILES" | grep -qE '^(src-tauri/(tauri[^/]*\.json|Cargo\.toml|Cargo\.lock|build\.rs|Info\.plist|entitlements[^/]*)|scripts/|\.github/workflows/ci\.yml|package\.json$|pnpm-lock\.yaml$)'; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: Core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: argus-core
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: argus-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/auto-heal-i18n.mjs
      - run: pnpm run typecheck
      - run: pnpm test
      # PRs already typecheck; the bundler build runs once the change lands.
      - if: github.event_name != 'pull_request'
        run: pnpm run build

  macos:
    name: macOS .dmg (${{ matrix.arch }})
    # Runs in parallel with the checks; publish waits for all of them.
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only (Intel Macs are out of scope).
          - arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
          # PR caches are not shared across branches; only main feeds the cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: brew install mpv pkg-config
      # Stage libmpv and its dylib closure with @rpath install names; build.rs links it.
      - name: Prepare bundled macOS libraries
        id: macos-libraries
        run: |
          FRAMEWORKS_DIR="$RUNNER_TEMP/argus-macos-frameworks-${{ matrix.target }}"
          CONFIG_PATH="$RUNNER_TEMP/tauri-macos-libmpv-${{ matrix.target }}.json"
          python3 scripts/macos-bundle-libmpv.py prepare \
            --frameworks "$FRAMEWORKS_DIR" \
            --config "$CONFIG_PATH" \
            --target "${{ matrix.target }}"
          echo "ARGUS_MACOS_FRAMEWORKS_DIR=$FRAMEWORKS_DIR" >> "$GITHUB_ENV"
          echo "ARGUS_MACOS_LIB_DIR=$FRAMEWORKS_DIR/link" >> "$GITHUB_ENV"
          echo "config=--config $CONFIG_PATH" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # Bundled fonts (CJK subset) are fetched with pinned checksums, not committed.
      - run: pnpm run setup:fonts
      # yt-dlp / ffmpeg / ffprobe sidecars declared as externalBin.
      - run: pnpm run setup:binaries
      # PRs that only touch Rust sources skip the bundle and compile-check instead.
      - name: Cargo check (PR without packaging changes)
        if: github.event_name == 'pull_request' && needs.changes.outputs.bundle != 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      # Non-PR builds feed the beta channel: version MAJOR.MINOR.<run number>
      # so every main build is newer than the last for the updater.
      # The updater public key comes from the TAURI_UPDATER_PUBKEY repo variable
      # so the keypair can be rotated without a code change.
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "::error::Add the TAURI_UPDATER_PUBKEY repo variable to publish updates"; exit 1
          fi
          node -e '
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const [maj, min] = c.version.split(".");
            c.version = `${maj}.${min}.${process.env.GITHUB_RUN_NUMBER}`;
            c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            require("fs").writeFileSync(f, JSON.stringify(c, null, 2));
            console.log("version", c.version);
          '
      # Unsigned until an Apple Developer ID is added as a repo secret.
      - if: github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app ${{ steps.macos-libraries.outputs.config }} --ignore-version-mismatches
        env:
          # Optional: enable Trakt/Simkl sign-in (apps registered by the maintainer).
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
      - name: Verify the app and build the .dmg
        if: github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Argus.app"
          python3 scripts/macos-bundle-libmpv.py verify-app --app "$APP" --target "${{ matrix.target }}"
          mkdir -p dist-dmg && cp -R "$APP" dist-dmg/
          ln -s /Applications dist-dmg/Applications
          hdiutil create -volname Argus -srcfolder dist-dmg -ov -format UDZO "Argus-${{ matrix.arch }}.dmg"
          du -h "Argus-${{ matrix.arch }}.dmg"
      - name: Sign the update bundle and write latest.json
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repo secret to publish updates"; exit 1
          fi
          # Built from the bundled, codesigned app so updates carry libmpv too.
          # Max gzip level: the updater only reads tar.gz and the bundle is ~150 MB.
          tar -cf - -C dist-dmg Argus.app | gzip -9 > "Argus-${{ matrix.arch }}.app.tar.gz"
          pnpm tauri signer sign "$PWD/Argus-${{ matrix.arch }}.app.tar.gz"
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          SIG=$(cat "Argus-${{ matrix.arch }}.app.tar.gz.sig")
          URL="https://github.com/${{ github.repository }}/releases/download/beta/Argus-${{ matrix.arch }}.app.tar.gz"
          node -e '
            const [version, sig, url, sha] = process.argv.slice(1);
            const out = {
              version,
              notes: `Argus ${version} (${sha.slice(0, 7)})`,
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": { signature: sig, url } },
            };
            require("fs").writeFileSync("latest.json", JSON.stringify(out, null, 2));
          ' "$VERSION" "$SIG" "$URL" "$GITHUB_SHA"
          cat latest.json
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true'
        with:
          name: Argus-macOS-${{ matrix.arch }}
          path: |
            Argus-${{ matrix.arch }}.dmg
            Argus-${{ matrix.arch }}.app.tar.gz
            latest.json
          if-no-files-found: ignore

  # Publishes as soon as the .dmg and every check have passed.
  publish:
    name: Publish release
    needs: [core, ui, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Argus-macOS-aarch64
      # Stable release feed. The tag keeps its original name so installs that already
      # point the updater at beta/latest.json keep updating.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Argus 1.0
          prerelease: false
          make_latest: true
          files: |
            Argus-aarch64.dmg
            Argus-aarch64.app.tar.gz
            latest.json
          body: |
            Argus 1.0, latest stable build. Installed copies of Argus update themselves from here (Settings → Updates).
            First install: download the .dmg. Apple Silicon only. Unsigned build: right-click Argus.app → Open the first time.
      # Keep the last builds as their own releases and list them in
      # versions-beta.json so Settings > Rollback can offer earlier versions.
      - name: Update version history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = "refs/heads/main" ] || exit 0
          VERSION=$(jq -r .version latest.json)
          TAG="build-$VERSION"
          NOTES=$(printf '%s' "$COMMIT_MSG" | head -n1)
          gh release create "$TAG" Argus-aarch64.dmg --repo "$REPO" --latest=false \
            --target "$GITHUB_SHA" --title "Argus $VERSION" --notes "$NOTES"
          gh release download beta --repo "$REPO" -p versions-beta.json -O old.json || echo '{"versions":[]}' > old.json
          jq --arg v "$VERSION" --arg n "$NOTES" --arg d "$(date -u +%FT%TZ)" \
             --arg u "https://github.com/$REPO/releases/download/$TAG/Argus-aarch64.dmg" \
            '{versions: ([{version:$v,date:$d,notes:$n,mac:$u,channel:"beta"}] + (.versions // [] | map(select(.version != $v))))[:10]}' \
            old.json > versions-beta.json
          gh release upload beta versions-beta.json --repo "$REPO" --clobber
          # Drop build releases that fell out of the list.
          for old in $(jq -r '.versions[]?.version' old.json); do
            if ! jq -e --arg v "$old" '.versions[] | select(.version == $v)' versions-beta.json > /dev/null; then
              gh release delete "build-$old" --repo "$REPO" --cleanup-tag -y || true
            fi
          done
      # A v* tag push, or a manual run with release_tag set, publishes the
      # .dmg as a GitHub pre-release (the tag is created if missing).
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Argus ${{ inputs.release_tag || github.ref_name }}
          files: Argus-aarch64.dmg
          prerelease: false
          generate_release_notes: true
          body: |
            Apple Silicon (M1 or newer), macOS 11+. Unsigned build: on first launch, right-click Argus.app → Open, or run `xattr -dr com.apple.quarantine /Applications/Argus.app`.
