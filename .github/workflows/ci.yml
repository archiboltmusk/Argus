name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the .dmg as a pre-release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: argus-core
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: argus-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  macos:
    name: macOS .dmg (${{ matrix.arch }})
    needs: [core, ui]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only (Intel Macs are out of scope).
          - arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: brew install mpv dylibbundler
      # Minimal LGPL ffmpeg (audio decode + silencedetect + https/http input) for
      # subtitle auto-sync. Built from the official source tarball, no GPL or
      # nonfree parts, linked statically so the app needs no extra dylibs.
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-bin
          key: ffmpeg-7.1.1-lgpl-${{ matrix.target }}-v1
      - name: Build LGPL ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cd ffmpeg-7.1.1
          SSL="$(brew --prefix openssl@3)"
          # Only the static archives, so the linker cannot pick the dylibs.
          mkdir -p "$PWD/../ssl-static/lib"
          cp "$SSL"/lib/libssl.a "$SSL"/lib/libcrypto.a "$PWD/../ssl-static/lib/"
          # Hide brew .pc files so configure falls back to our static -lssl -lcrypto.
          export PKG_CONFIG_LIBDIR="$PWD/../empty-pc"; mkdir -p "$PKG_CONFIG_LIBDIR"
          ./configure --prefix="$PWD/../ffmpeg-out" --enable-version3 \
            --disable-gpl --disable-nonfree --disable-autodetect \
            --disable-doc --disable-debug --disable-ffplay --disable-ffprobe \
            --disable-avdevice --disable-swscale --disable-postproc \
            --disable-encoders --disable-muxers --enable-muxer=null \
            --enable-encoder=pcm_s16le \
            --enable-network --enable-openssl \
            --extra-cflags="-I$SSL/include" \
            --extra-ldflags="-L$PWD/../ssl-static/lib"
          make -j"$(sysctl -n hw.ncpu)"
          mkdir -p ../ffmpeg-bin
          cp ffmpeg ../ffmpeg-bin/ffmpeg
          strip ../ffmpeg-bin/ffmpeg
          if otool -L ../ffmpeg-bin/ffmpeg | grep -E "/opt/homebrew|/usr/local"; then
            echo "::error::ffmpeg links Homebrew paths"; exit 1
          fi
          ../ffmpeg-bin/ffmpeg -hide_banner -version | head -3
          ../ffmpeg-bin/ffmpeg -hide_banner -version | grep -q -- "--disable-gpl"
      - run: pnpm install --frozen-lockfile
      # Bundled fonts (CJK subset) are fetched with pinned checksums, not committed.
      - run: pnpm run setup:fonts
      # Non-PR builds feed the beta channel: version MAJOR.MINOR.<run number>
      # so every main build is newer than the last for the updater.
      # The updater public key comes from the TAURI_UPDATER_PUBKEY repo variable
      # so the keypair can be rotated without a code change.
      - name: Set beta version and updater key
        if: github.event_name != 'pull_request'
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "::error::Add the TAURI_UPDATER_PUBKEY repo variable to publish updates"; exit 1
          fi
          node -e '
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const [maj, min] = c.version.split(".");
            c.version = `${maj}.${min}.${process.env.GITHUB_RUN_NUMBER}`;
            c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            require("fs").writeFileSync(f, JSON.stringify(c, null, 2));
            console.log("version", c.version);
          '
      # Unsigned until an Apple Developer ID is added as a repo secret.
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles app
        env:
          # Optional: enable Trakt/Simkl sign-in (apps registered by the maintainer).
          ARGUS_TRAKT_CLIENT_ID: ${{ secrets.ARGUS_TRAKT_CLIENT_ID }}
          ARGUS_TRAKT_CLIENT_SECRET: ${{ secrets.ARGUS_TRAKT_CLIENT_SECRET }}
          ARGUS_SIMKL_CLIENT_ID: ${{ secrets.ARGUS_SIMKL_CLIENT_ID }}
      - name: Bundle libmpv into the app and build the .dmg
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Argus.app"
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")"
          # Copy libmpv and every dylib it pulls in, rewriting install names,
          # so the app runs on a Mac without Homebrew.
          dylibbundler -od -b -cd \
            -x "$EXE" \
            -d "$APP/Contents/Frameworks/" \
            -p @executable_path/../Frameworks/
          if otool -L "$EXE" "$APP"/Contents/Frameworks/*.dylib | grep -E "/opt/homebrew|/usr/local"; then
            echo "::error::App still links Homebrew paths"; exit 1
          fi
          # Sidecar next to the main binary; locate_ffmpeg() checks there first.
          cp ffmpeg-bin/ffmpeg "$(dirname "$EXE")/ffmpeg"
          chmod +x "$(dirname "$EXE")/ffmpeg"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist-dmg && cp -R "$APP" dist-dmg/
          ln -s /Applications dist-dmg/Applications
          hdiutil create -volname Argus -srcfolder dist-dmg -ov -format UDZO "Argus-${{ matrix.arch }}.dmg"
          du -h "Argus-${{ matrix.arch }}.dmg"
      - name: Sign the update bundle and write latest.json
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repo secret to publish updates"; exit 1
          fi
          # Built from the bundled, codesigned app so updates carry libmpv too.
          tar -czf "Argus-${{ matrix.arch }}.app.tar.gz" -C dist-dmg Argus.app
          pnpm tauri signer sign "$PWD/Argus-${{ matrix.arch }}.app.tar.gz"
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          SIG=$(cat "Argus-${{ matrix.arch }}.app.tar.gz.sig")
          URL="https://github.com/${{ github.repository }}/releases/download/beta/Argus-${{ matrix.arch }}.app.tar.gz"
          node -e '
            const [version, sig, url, sha] = process.argv.slice(1);
            const out = {
              version,
              notes: `Beta build ${version} (${sha.slice(0, 7)})`,
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": { signature: sig, url } },
            };
            require("fs").writeFileSync("latest.json", JSON.stringify(out, null, 2));
          ' "$VERSION" "$SIG" "$URL" "$GITHUB_SHA"
          cat latest.json
      # Rolling beta channel: the in-app updater reads beta/latest.json.
      - if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Argus beta
          prerelease: true
          make_latest: false
          files: |
            Argus-${{ matrix.arch }}.dmg
            Argus-${{ matrix.arch }}.app.tar.gz
            latest.json
          body: |
            Rolling beta. Installed copies of Argus 0.2+ update themselves from here (Settings → Updates).
            First install: download the .dmg. Apple Silicon only. Unsigned build: right-click Argus.app → Open the first time.
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-macOS-${{ matrix.arch }}
          path: Argus-${{ matrix.arch }}.dmg
          if-no-files-found: error
      # A v* tag push, or a manual run with release_tag set, publishes the
      # .dmg as a GitHub pre-release (the tag is created if missing).
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Argus ${{ inputs.release_tag || github.ref_name }}
          files: Argus-${{ matrix.arch }}.dmg
          prerelease: true
          generate_release_notes: true
          body: |
            Apple Silicon (M1 or newer), macOS 11+. Unsigned build: on first launch, right-click Argus.app → Open, or run `xattr -dr com.apple.quarantine /Applications/Argus.app`.
