name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p argus-core --all-targets -- -D warnings
      - run: cargo test -p argus-core

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build

  macos:
    name: macOS .dmg
    runs-on: macos-14
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy -p argus-desktop -- -D warnings
      # Unsigned until an Apple Developer ID is added as a repo secret.
      - run: pnpm --filter desktop tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Argus-macOS-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
