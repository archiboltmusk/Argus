name: Smart TV Ecosystem (Tizen, webOS, VIDAA, Titan OS, Panasonic, Roku & Web TV)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "index-tv.html"
      - "smart-tv/**"
      - "scripts/package-smart-tv.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/smart-tv.yml"
  workflow_dispatch:

concurrency:
  group: smart-tv-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  package:
    name: Build All Major Smart TV OS Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - name: Package Smart TV Builds
        run: pnpm run package:smart-tv
      - name: Verify outputs
        run: ls -lh dist-smart-tv/
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-Smart-TV-Packages
          path: |
            dist-smart-tv/Argus-Samsung-Tizen.wgt
            dist-smart-tv/Argus-Samsung-TheFreestyle.wgt
            dist-smart-tv/Argus-LG-webOS.zip
            dist-smart-tv/Argus-LG-CineBeam.zip
            dist-smart-tv/Argus-SmartProjector-WebTV.zip
            dist-smart-tv/Argus-Hisense-VIDAA.zip
            dist-smart-tv/Argus-Philips-TitanOS.zip
            dist-smart-tv/Argus-Panasonic-MyHomeScreen.zip
            dist-smart-tv/Argus-Roku-Channel.zip
            dist-smart-tv/Argus-WebTV-10foot-standalone.zip
          if-no-files-found: error

  publish:
    name: Publish Smart TV Bundles to Release
    needs: package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Argus-Smart-TV-Packages
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          gh release upload "$TAG" \
            Argus-Samsung-Tizen.wgt \
            Argus-Samsung-TheFreestyle.wgt \
            Argus-LG-webOS.zip \
            Argus-LG-CineBeam.zip \
            Argus-SmartProjector-WebTV.zip \
            Argus-Hisense-VIDAA.zip \
            Argus-Philips-TitanOS.zip \
            Argus-Panasonic-MyHomeScreen.zip \
            Argus-Roku-Channel.zip \
            Argus-WebTV-10foot-standalone.zip \
            --repo "$GITHUB_REPOSITORY" --clobber || true
