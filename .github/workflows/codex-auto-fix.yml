name: Codex CI Auto-Fix

# Only react to failed CI runs on main. Never run the fixer on untrusted PR code.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  generate_fix:
    name: Diagnose failure and generate patch
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch }}
    steps:
      - name: Check out failed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Collect failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > .codex-ci-failure.log || true
          if [ ! -s .codex-ci-failure.log ]; then
            echo "GitHub did not provide failed-step logs for this run." > .codex-ci-failure.log
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether autofix is configured
        id: key_check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set the OPENAI_API_KEY Actions secret to enable automatic fixes."
          fi

      - name: Ask Codex for a minimal fix
        if: steps.key_check.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt: |
            You are diagnosing a failed CI run in the Argus repository.
            First read .codex-ci-failure.log and inspect the relevant workflow and source files.
            Reproduce the failure where practical. Make the smallest defensible code or
            test/configuration change that addresses the underlying cause. Do not weaken,
            delete, skip, or loosen tests/checks to make CI green. Do not make unrelated
            refactors, dependency upgrades, releases, or changes to secrets/permissions.
            If the logs do not identify a reproducible actionable defect, make no changes.
            Do not commit or push. The workflow will independently run the verification suite.

      - name: Export patch only if Codex changed files
        id: diff
        run: |
          git add -N -- . ':!.codex-ci-failure.log' ':!codex.patch'
          git diff --binary -- . ':!.codex-ci-failure.log' ':!codex.patch' > codex.patch
          if [ -s codex.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload candidate patch
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-candidate-patch
          path: codex.patch
          if-no-files-found: error
          retention-days: 2

  verify_fix:
    name: Verify candidate patch
    needs: generate_fix
    if: needs.generate_fix.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out failed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: codex-candidate-patch

      - name: Apply candidate patch
        run: git apply --index codex.patch

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify UI typecheck
        run: pnpm run typecheck

      - name: Verify UI tests
        run: pnpm test

      - name: Verify production build
        run: pnpm run build

      - name: Verify Rust core
        working-directory: argus-core
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          cargo fmt --check
          cargo clippy --all-targets
          cargo test

      - name: Upload verified patch
        uses: actions/upload-artifact@v7
        with:
          name: codex-verified-patch
          path: codex.patch
          if-no-files-found: error
          retention-days: 2

  open_fix_pr:
    name: Open a reviewable fix PR
    needs: verify_fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out failed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: codex-verified-patch

      - name: Apply verified patch
        run: git apply --index codex.patch

      - name: Create branch and commit
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "codex/ci-autofix-$RUN_ID"
          git commit -m "fix(ci): propose verified automatic fix"
          git push origin "codex/ci-autofix-$RUN_ID"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "codex/ci-autofix-$RUN_ID" \
            --title "fix(ci): propose verified automatic fix" \
            --body "Codex generated a minimal patch after CI failed at commit `$FAILED_SHA`. The UI typecheck, UI tests, production build, and Rust core checks passed on the patch. Review before merging. Failed run: $FAILED_URL"
