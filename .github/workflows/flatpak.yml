name: Flatpak

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode (build-only, dry-run, publish)"
        type: choice
        options:
          - build-only
          - dry-run
          - publish
        default: build-only
  push:
    branches: [main]
    paths:
      - flatpak/**
      - src-tauri/**
      - argus-core/**
      - src/**
      - public/**
      - index.html
      - vite.config.*
      - tsconfig*.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatpak.yml

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux Flatpak (SteamOS / Flathub)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils ostree

      - name: Configure Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install pinned SDK
        run: >-
          flatpak install --user -y flathub
          org.gnome.Platform//49 org.gnome.Sdk//49
          org.freedesktop.Sdk.Extension.rust-stable//25.08
          org.freedesktop.Sdk.Extension.node22//25.08

      - name: Validate metadata
        run: |
          desktop-file-validate flatpak/app.argus.desktop.desktop
          appstreamcli validate --no-net flatpak/app.argus.desktop.metainfo.xml
          flatpak-builder --show-manifest flatpak/app.argus.desktop.yml >/dev/null

      - name: Build repository & Flatpak bundle
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::Flatpak build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime 2>/dev/null || true
              ps aux --sort=-%mem | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT

          flatpak-builder --user --force-clean --state-dir=.flatpak-work/state --repo=.flatpak-work/repo .flatpak-work/build flatpak/app.argus.desktop.yml
          flatpak build-bundle .flatpak-work/repo Argus.flatpak app.argus.desktop

          kill "${monitor_pid}" 2>/dev/null || true
          trap - EXIT

      - name: Validate bundle
        run: |
          ostree init --repo=.flatpak-work/validation-repo --mode=archive-z2
          flatpak build-import-bundle --update-appstream --no-update-summary .flatpak-work/validation-repo Argus.flatpak

      - name: Generate Step Summary Checksum Card
        run: |
          echo "### 📦 Flatpak Bundle Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          fsize=$(du -h Argus.flatpak | cut -f1)
          fhash=$(sha256sum Argus.flatpak | cut -d' ' -f1)
          echo "| \`Argus.flatpak\` | Linux x86_64 / SteamOS | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: Argus-flatpak-x86_64
          path: Argus.flatpak
          retention-days: 14
          if-no-files-found: error
