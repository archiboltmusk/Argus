name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "argus-core/**"
      - "index-tv.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/android-patch-manifest.mjs"
      - "docs/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/android-patch-manifest.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: Android arm64 APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK; only the NDK and build-tools pin are installed here.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-cross-targets
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      # src-tauri/gen/ is gitignored scaffolding; recreate it for the runner.
      - run: pnpm tauri android init --ci
      # Cleartext to the local torrent engine and the Android TV launcher entry.
      - run: node scripts/android-patch-manifest.mjs
      - name: Build release APKs (arm64 and armv7)
        run: |
          pnpm tauri android build --apk --target aarch64 --ci --ignore-version-mismatches
          # Also build armv7 (32-bit) which is required by almost all budget/smart projectors
          pnpm tauri android build --apk --target armv7 --ci --ignore-version-mismatches || echo "::warning::armv7 build step failed, continuing with arm64"
      # Release APKs come out unsigned and cannot be installed. Sign with the
      # ANDROID_KEYSTORE_* secrets when set so updates over an older install
      # work; otherwise fall back to a throwaway key (fresh installs only).
      # cc-rs swallows the compiler's own diagnostics; replay the first failing unit.
      - name: Diagnose native build failure
        if: failure()
        run: |
          echo "NDK_HOME=$NDK_HOME"; ls "$ANDROID_HOME/ndk"
          CXX=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ | head -n1)
          cd src-tauri/vendor/unrar_sys
          "$CXX" -DANDROID -std=c++14 -stdlib=libc++ -D_FILE_OFFSET_BITS=64 -DRARDLL -fsyntax-only vendor/unrar/extinfo.cpp 2>&1 | head -40
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with deterministic CI keystore. If updating on projector/TV, uninstall existing version first if signed with a different key."
            STORE_PASS=android; ALIAS=argus
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Argus CI, O=Argus, C=US"
          fi

          # Find and sign arm64 APK
          ARM64_APK=$(find src-tauri/gen/android -name '*arm64*-release-unsigned.apk' -o -name '*aarch64*-release-unsigned.apk' -print -quit || true)
          if [ -z "$ARM64_APK" ]; then
            ARM64_APK=$(find src-tauri/gen/android -name '*-release-unsigned.apk' -print -quit)
          fi
          test -n "$ARM64_APK"
          "$BT/zipalign" -f -p 4 "$ARM64_APK" aligned-arm64.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$ALIAS" --out Argus-android-arm64.apk aligned-arm64.apk
          "$BT/apksigner" verify Argus-android-arm64.apk
          cp Argus-android-arm64.apk Argus-AndroidTV-arm64.apk

          # Find and sign armv7 (32-bit projector) APK if built
          ARMV7_APK=$(find src-tauri/gen/android -name '*armv7*-release-unsigned.apk' -o -name '*armeabi*-release-unsigned.apk' -print -quit || true)
          if [ -n "$ARMV7_APK" ]; then
            "$BT/zipalign" -f -p 4 "$ARMV7_APK" aligned-armv7.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$STORE_PASS" \
              --ks-key-alias "$ALIAS" --out Argus-android-armv7.apk aligned-armv7.apk
            "$BT/apksigner" verify Argus-android-armv7.apk
            cp Argus-android-armv7.apk Argus-SmartProjector-AndroidTV-armv7.apk
            # Projectors default to armv7 if 32-bit:
            cp Argus-android-armv7.apk Argus-SmartProjector-AndroidTV.apk
          else
            echo "::notice::armv7 APK was not produced; falling back Argus-SmartProjector-AndroidTV.apk to arm64"
            cp Argus-android-arm64.apk Argus-SmartProjector-AndroidTV.apk
          fi

          ls -la Argus-*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-android-packages
          path: |
            Argus-*.apk
          if-no-files-found: error

  publish:
    name: Publish APK to Releases
    needs: apk
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Argus-android-packages
      # Sideload only: the in-app updater is not wired on Android.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Argus $TAG" --notes "Argus Automated Build" --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$TAG" Argus-*.apk --repo "$GITHUB_REPOSITORY" --clobber || true
