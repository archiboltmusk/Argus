name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "argus-core/**"
      - "index-tv.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/android-css-compat.*"
      - "scripts/android-patch-manifest.mjs"
      - "docs/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/android-patch-manifest.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: Android arm64 APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK; only the NDK and build-tools pin are installed here.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-cross-targets
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      # src-tauri/gen/ is gitignored scaffolding; recreate it for the runner.
      - run: pnpm tauri android init --ci
      # Cleartext to the local torrent engine and the Android TV launcher entry.
      - run: node scripts/android-patch-manifest.mjs
      - run: node --test tests/android-native-launcher.test.mjs
      - name: Build release APKs (arm64, armv7, and universal)
        run: |
          pnpm tauri android build --apk -t aarch64 -t armv7 --config src-tauri/tauri.android.conf.json --split-per-abi --ci --ignore-version-mismatches
          pnpm tauri android build --apk -t aarch64 -t armv7 --config src-tauri/tauri.android.conf.json --ci --ignore-version-mismatches
      # Release APKs come out unsigned and cannot be installed. Sign with the
      # ANDROID_KEYSTORE_* secrets when set so updates over an older install
      # work; otherwise fall back to a throwaway key (fresh installs only).
      # cc-rs swallows the compiler's own diagnostics; replay the first failing unit.
      - name: Diagnose native build failure
        if: failure()
        run: |
          echo "NDK_HOME=$NDK_HOME"; ls "$ANDROID_HOME/ndk"
          CXX=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ | head -n1)
          cd src-tauri/vendor/unrar_sys
          "$CXX" -DANDROID -std=c++14 -stdlib=libc++ -D_FILE_OFFSET_BITS=64 -DRARDLL -fsyntax-only vendor/unrar/extinfo.cpp 2>&1 | head -40
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with deterministic CI keystore. If updating on projector/TV, uninstall existing version first if signed with a different key."
            STORE_PASS=android; ALIAS=argus
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Argus CI, O=Argus, C=US"
          fi

          # Find and sign arm64 APK
          ARM64_APK=$(find src-tauri/gen/android -name '*arm64-v8a*-release-unsigned.apk' -print -quit || true)
          if [ -z "$ARM64_APK" ]; then
            ARM64_APK=$(find src-tauri/gen/android \( -name '*universal*-release-unsigned.apk' -o -name '*-release-unsigned.apk' \) -print -quit)
          fi
          test -n "$ARM64_APK"
          "$BT/zipalign" -f -p 4 "$ARM64_APK" aligned-arm64.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$ALIAS" --out Argus-android-arm64.apk aligned-arm64.apk
          "$BT/apksigner" verify Argus-android-arm64.apk
          cp Argus-android-arm64.apk Argus-AndroidTV-arm64.apk

          # Find and sign armv7 (32-bit projector) APK
          ARMV7_APK=$(find src-tauri/gen/android \( -name '*armeabi-v7a*-release-unsigned.apk' -o -name '*armv7*-release-unsigned.apk' \) -print -quit || true)
          if [ -n "$ARMV7_APK" ]; then
            "$BT/zipalign" -f -p 4 "$ARMV7_APK" aligned-armv7.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$STORE_PASS" \
              --ks-key-alias "$ALIAS" --out Argus-android-armv7.apk aligned-armv7.apk
            "$BT/apksigner" verify Argus-android-armv7.apk
            cp Argus-android-armv7.apk Argus-SmartProjector-AndroidTV-armv7.apk
          fi

          # Sign Universal (arm64 + armv7 dual ABI) APK as the primary Smart Projector APK
          UNIV_APK=$(find src-tauri/gen/android -name '*universal*-release-unsigned.apk' -print -quit || true)
          if [ -n "$UNIV_APK" ]; then
            "$BT/zipalign" -f -p 4 "$UNIV_APK" aligned-univ.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$STORE_PASS" \
              --ks-key-alias "$ALIAS" --out Argus-SmartProjector-AndroidTV.apk aligned-univ.apk
            "$BT/apksigner" verify Argus-SmartProjector-AndroidTV.apk
          elif [ -n "$ARMV7_APK" ]; then
            cp Argus-SmartProjector-AndroidTV-armv7.apk Argus-SmartProjector-AndroidTV.apk
          else
            cp Argus-android-arm64.apk Argus-SmartProjector-AndroidTV.apk
          fi

          ls -la Argus-*.apk
      - name: Smoke-check APK badging & ABIs
        run: |
          set -euo pipefail
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort -V | tail -n1)
          for apk in Argus-*.apk; do
            echo "Verifying $apk..."
            [ -s "$apk" ] || { echo "::error::$apk is empty"; exit 1; }
            "$AAPT2" dump badging "$apk" | grep -E "package:|launchable-activity:|native-code:"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Argus-android-packages
          path: |
            Argus-*.apk
          if-no-files-found: error

  publish:
    name: Publish APK to Releases
    needs: apk
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Argus-android-packages
      # Sideload only: the in-app updater is not wired on Android.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.17.1"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          RELEASE_FLAGS=(--latest=false)
          if [ "$TAG" = "beta" ]; then RELEASE_FLAGS+=(--prerelease); fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Argus $TAG" --notes "Argus Automated Build" --repo "$GITHUB_REPOSITORY" "${RELEASE_FLAGS[@]}" || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          fi
          gh release upload "$TAG" Argus-*.apk --repo "$GITHUB_REPOSITORY" --clobber

  emulator-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Argus-android-packages
          path: apks
      - name: Boot Android TV emulator & verify APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK=$(ls apks/Argus-*.apk | head -n1)
            adb install -r "$APK"
            PKG=$(aapt2 dump badging "$APK" 2>/dev/null | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n1 || echo "app.argus.desktop")
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            sleep 8
            if adb logcat -d | grep -E "FATAL EXCEPTION|UnsatisfiedLinkError"; then
              echo "::error::Android runtime crash detected in logcat"
              exit 1
            fi
